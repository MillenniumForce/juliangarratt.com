<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Image View</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #ffffff;
    }

    .hero-image {
      max-width: min(95vw, 1000px);
      max-height: 95vh;
      width: auto;
      height: auto;
      display: block;
      transform: rotate(var(--tilt-angle, 0deg));
      transition: transform 0.2s ease;
      transform-origin: center center;
    }

    .hero-image.is-tilted {
      transform: rotate(var(--tilt-angle, 0deg));
    }
  </style>
</head>
<body>
  <img src="images/output.png" alt="Building cutout" class="hero-image">
  <script>
    const heroImage = document.querySelector(".hero-image");

    heroImage.addEventListener("mouseenter", () => {
      const direction = Math.random() < 0.5 ? -1 : 1;
      const magnitude = Math.random() * 5 + 5;
      heroImage.style.setProperty("--tilt-angle", `${direction * magnitude}deg`);
      heroImage.classList.add("is-tilted");
    });

    heroImage.addEventListener("mouseleave", () => {
      heroImage.style.setProperty("--tilt-angle", "0deg");
      heroImage.classList.remove("is-tilted");
    });
  </script>
</body>
</html>
